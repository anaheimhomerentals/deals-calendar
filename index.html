<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Deal drop calendar</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --paper:#F6F1E4;
    --paper-raised:#FCF9F0;
    --ink:#221B14;
    --ink-soft:#635947;
    --line:#DED2AE;
    --red:#C6293B;
    --red-ink:#4A0E15;
    --red-tint:#F6DCDD;
    --teal:#1B6F68;
    --teal-ink:#0C332F;
    --teal-tint:#DCEAE6;
    --mustard:#D98F1E;
    --mustard-ink:#4A3007;
    --mustard-tint:#F5E4C1;
    --card:#FFFDF8;
    --border:#DED2AE;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Inter',sans-serif;}
  .app{max-width:920px;margin:0 auto;padding:28px 20px 60px;}
  h1,h2{font-family:'Fraunces',serif;font-weight:600;margin:0;}
  .topbar{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
  .topbar h1{font-size:26px;}
  .topbar p{margin:4px 0 0;color:var(--ink-soft);font-size:14px;}
  .panel{margin-top:26px;background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;padding:18px 20px;}
  .empty-state{color:var(--ink-soft);font-size:14px;padding:8px 0 4px;}
  .deal{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:12px 0;border-top:1px dashed var(--line);}
  .deal:first-of-type{border-top:none;}
  .discount{font-family:'Fraunces',serif;font-weight:600;font-size:15px;background:var(--teal-tint);color:var(--teal-ink);border-radius:6px;padding:6px 9px;white-space:nowrap;text-align:center;margin-bottom:4px;}
  .deal-brand{font-weight:600;font-size:15px;}
  .deal-item{font-size:13px;color:var(--ink-soft);margin-top:1px;}
  .deal-note{font-size:12px;color:var(--ink-soft);margin-top:4px;font-style:italic;}
  .deal-link{font-size:12px;color:var(--red);text-decoration:none;display:inline-block;margin-top:4px;}
  .deal-link:hover{text-decoration:underline;}
  .loading{color:var(--ink-soft);font-size:14px;padding:20px 0;}
  .standing{margin-top:16px;background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;padding:18px 20px;}
  .standing h2{font-size:18px;margin-bottom:2px;}
  .standing p.sub{color:var(--ink-soft);font-size:13px;margin:0 0 10px;}
  .schedule-badge{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;background:var(--mustard-tint);color:var(--mustard-ink);border-radius:6px;padding:3px 7px;white-space:nowrap;}
  .deal-address{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .deal-time{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--teal-ink);margin-top:2px;}
  .mapwrap{margin-top:16px;background:var(--paper-raised);border:1px solid var(--line);border-radius:12px;padding:18px 20px;}
  .mapwrap h2{font-size:18px;margin-bottom:2px;}
  .mapwrap p.sub{color:var(--ink-soft);font-size:13px;margin:0 0 12px;}
  #map{height:320px;border-radius:8px;border:1px solid var(--line);}
  .leaflet-popup-content-wrapper{background:var(--paper-raised);color:var(--ink);border-radius:8px;}
  .leaflet-popup-content{font-family:'Inter',sans-serif;font-size:13px;margin:10px 12px;}
  .popup-brand{font-weight:600;margin-bottom:2px;}
  .popup-schedule{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--mustard-ink);}
  .deal-trigger{font-size:11px;margin-top:6px;padding:4px 8px;border-radius:6px;display:inline-block;}
  .deal-trigger-active{background:#E4F3EC;color:#1F6B4A;font-weight:600;}
  .deal-trigger-inactive{background:#F1EDE3;color:var(--ink-soft);}
  .deal-trigger-unknown{background:#F1EDE3;color:var(--ink-soft);}
  .deal-trigger a{color:inherit;text-decoration:underline;}
  .standing-toggle{display:flex;align-items:center;gap:8px;background:none;border:none;padding:0;cursor:pointer;text-align:left;width:100%;}
  .standing-toggle h2{margin:0;}
  .standing-arrow{font-size:13px;color:var(--ink-soft);transition:transform 0.15s ease;display:inline-block;}
  .standing-toggle[aria-expanded="true"] .standing-arrow{transform:rotate(90deg);}
  .standing-body.collapsed{display:none;}
  .panel-nav{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:10px;}
  .dayarrow{background:var(--card);border:1px solid var(--border);border-radius:8px;width:38px;height:38px;font-size:18px;cursor:pointer;color:var(--ink);}
  .dayarrow:hover{background:var(--mustard-tint);}
  .panel-date{text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;}
  .panel-date h2{margin:0;font-size:19px;white-space:nowrap;}
  .live-clock{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .todaybtn{font-size:11px;font-weight:600;border:1px solid var(--teal);color:var(--teal);background:none;border-radius:6px;padding:2px 8px;cursor:pointer;}
  .todaybtn:hover{background:var(--teal);color:#fff;}
  .panel-actions{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .panel-actions input[type="date"]{border:1px solid var(--border);border-radius:8px;padding:6px 8px;background:var(--card);color:var(--ink);font-family:'Inter',sans-serif;font-size:13px;}
  .live-clock{margin:2px 0 0;font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--ink-soft);}
  .time-badge{font-size:11px;margin-top:6px;padding:4px 8px;border-radius:6px;display:inline-block;font-weight:600;}
  .time-active{background:#E4F3EC;color:#1F6B4A;}
  .time-inactive{background:#F1EDE3;color:var(--ink-soft);font-weight:500;}
@media (max-width: 480px){
  .app{padding:16px 12px 48px;}
  .topbar h1{font-size:21px;}
  .topbar p{font-size:13px;}
  .panel, .standing, .mapwrap{padding:14px 14px;}
  .panel-nav{gap:8px;}
  .dayarrow{width:32px;height:32px;font-size:16px;flex-shrink:0;}
  .panel-date h2{font-size:16px;}
  .live-clock{font-size:11px;}
  .panel-actions{gap:8px;}
  #map{height:220px;}
  .deal{gap:8px;}
  .discount{min-width:44px;font-size:13px;padding:5px 7px;}
}
</style>

<body>
<div class="app" id="app">

    <div>
      <h1>Deal drop calendar</h1>
      <p>Deals spotted around town — one-time drops or standing daily and weekly specials.</p>
    </div>
  </div>
  <div class="panel">
    <div class="panel-nav">
      <button id="prevDay" class="dayarrow" aria-label="Previous day">‹</button>
      <div class="panel-date">
        <h2 id="panelTitle">Select a day</h2>
        <p class="live-clock" id="liveClock"></p>
        <button id="todayBtn" class="todaybtn" type="button">Today</button>
      </div>
      <button id="nextDay" class="dayarrow" aria-label="Next day">›</button>
    </div>
    <div class="panel-actions">
      <input type="date" id="jumpDate" aria-label="Jump to date">
    </div>
    <div id="panelBody"><p class="loading">Loading your deals…</p></div>
  </div>
  <div class="standing">
    <button class="standing-toggle" id="standingToggle" type="button" aria-expanded="false">
      <span class="standing-arrow" id="standingArrow">▶</span>
      <h2>Standing deals</h2>
    </button>
    <p class="sub">Daily and weekly specials that don't belong to one date.</p>
    <div id="standingBody" class="standing-body collapsed"></div>
  </div>
  <div class="mapwrap">
    <h2>Deal map</h2>
    <p class="sub">Every deal with an address, pinned.</p>
    <div id="map"></div>
  </div>
</div>

function fmt(d){
  const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}

function mergeSeeds(){
  let changed = false;
  SEED_DEALS.forEach(seed => {
    const existing = deals.find(x => x.id === seed.id);
    if(!existing){
      deals.push(seed);
      changed = true;
    } else if(seed.time && !existing.time){
      existing.time = seed.time;
      changed = true;
    } else if(seed.endDate && existing.endDate !== seed.endDate){
      existing.endDate = seed.endDate;
      changed = true;
    }
  });
  deals = deals.map(x => x.repeat ? x : { ...x, repeat: 'once' });
  return changed;
}

function loadDeals(){
  deals = [];
  mergeSeeds();
  render();
}


function dealAppliesOnDate(x, dateStr, dow){
  if(x.endDate && dateStr > x.endDate) return false;
  if(x.repeat === 'once') return x.date === dateStr;
  if(x.repeat === 'daily') return true;
  if(x.repeat === 'weekly') return (x.daysOfWeek||[]).includes(dow);
  return false;
}

function render(){
  try{ renderPanel(); }catch(e){ console.error('renderPanel failed', e); }
  try{ renderStanding(); }catch(e){ console.error('renderStanding failed', e); }
  try{ renderMap(); }catch(e){ console.error('renderMap failed', e); }
}



function dealCardHtml(x, showLiveStatus){
  let triggerBadge = '';
  if(x.id === 'seed-panda-dodgers'){
    if(dodgersDealStatus === 'active'){
      triggerBadge = `<div class="deal-trigger deal-trigger-active">🔥 Active today — Dodgers won their last home game!</div>`;
    } else if(dodgersDealStatus === 'inactive'){
      triggerBadge = `<div class="deal-trigger deal-trigger-inactive">Not active today — no Dodgers home win yesterday.</div>`;
    } else {
      triggerBadge = `<div class="deal-trigger deal-trigger-unknown">Couldn't auto-check today's status — <a href="https://www.mlb.com/dodgers/schedule" target="_blank" rel="noopener">check the schedule</a>.</div>`;
    }
  }
  let timeBadge = '';
  if(x.time && showLiveStatus){
    const status = getTimeStatus(x);
    if(status === 'now'){
      timeBadge = `<div class="time-badge time-active">🟢 Valid right now</div>`;
    } else if(status === 'upcoming'){
      timeBadge = `<div class="time-badge time-inactive">Starts later today at ${escapeHtml(x.time.split(/–|—|-/)[0].trim())}</div>`;
    } else if(status === 'ended'){
      timeBadge = `<div class="time-badge time-inactive">Already ended for today</div>`;
    }
  }
  return `
    <div class="deal" data-id="${x.id}">
      <div class="discount">${escapeHtml(x.discount || '—')}</div>
      <div class="deal-brand">${escapeHtml(x.brand || 'Untitled')}${x.repeat !== 'once' ? ` <span class="schedule-badge">${escapeHtml(scheduleLabel(x))}</span>` : ''}</div>
      ${x.item ? `<div class="deal-item">${escapeHtml(x.item)}</div>` : ''}
      ${x.time ? `<div class="deal-time">${escapeHtml(x.time)}</div>` : ''}
      ${timeBadge}
      ${x.address ? `<div class="deal-address">${escapeHtml(x.address)}</div>` : ''}
      ${x.note ? `<div class="deal-note">${escapeHtml(x.note)}</div>` : ''}
      ${triggerBadge}
      ${x.link ? `<a class="deal-link" href="${escapeHtml(x.link)}" target="_blank" rel="noopener">View post</a>` : ''}
    </div>
  `;
}

function startMinutes(x){
  if(!x.time) return null;
  const m = x.time.match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM|am|pm)?/);
  if(!m) return null;
  let h = parseInt(m[1], 10);
  const min = m[2] ? parseInt(m[2], 10) : 0;
  const ampm = m[3] ? m[3].toUpperCase() : null;
  if(ampm === 'PM' && h !== 12) h += 12;
  if(ampm === 'AM' && h === 12) h = 0;
  return h * 60 + min;
}

function parseTimeToMinutes(token, fallbackAmPm){
  const m = token.match(/(\d{1,2})(?::(\d{2}))?\s*(AM|PM|am|pm)?/);
  if(!m) return null;
  let h = parseInt(m[1], 10);
  const min = m[2] ? parseInt(m[2], 10) : 0;
  const ampm = m[3] ? m[3].toUpperCase() : fallbackAmPm;
  if(ampm === 'PM' && h !== 12) h += 12;
  if(ampm === 'AM' && h === 12) h = 0;
  return h * 60 + min;
}

function parseTimeRange(str){
  if(!str) return null;
  const parts = str.split(/–|—|-|\bto\b/i).map(s => s.trim()).filter(Boolean);
  if(parts.length !== 2) return null;
  const endAmPmMatch = parts[1].match(/(AM|PM|am|pm)/);
  const fallback = endAmPmMatch ? endAmPmMatch[1].toUpperCase() : null;
  const start = parseTimeToMinutes(parts[0], fallback);
  let end = parseTimeToMinutes(parts[1], fallback);
  if(start === null || end === null) return null;
  if(end <= start) end += 24 * 60; // overnight window
  return { start, end };
}

function getTimeStatus(x){
  const now = new Date();
  const todayStr = fmt(now);
  const dow = now.getDay();
  if(!dealAppliesOnDate(x, todayStr, dow)) return null;
  const range = parseTimeRange(x.time);
  if(!range) return null;
  let nowMin = now.getHours() * 60 + now.getMinutes();
  if(range.end > 24 * 60 && nowMin < range.start) nowMin += 24 * 60;
  if(nowMin >= range.start && nowMin < range.end) return 'now';
  if(nowMin < range.start) return 'upcoming';
  return 'ended';
}

function sortByTime(list){
  return list.slice().sort((a,b) => {
    const ta = startMinutes(a), tb = startMinutes(b);
    if(ta === null && tb === null) return (b.createdAt||0) - (a.createdAt||0);
    if(ta === null) return 1;
    if(tb === null) return -1;
    return ta - tb;
  });
}

function scheduleLabel(x){
  if(x.repeat === 'daily') return 'Every day';
  if(x.repeat === 'weekly'){
    const names = ['Su','Mo','Tu','We','Th','Fr','Sa'];
    return (x.daysOfWeek||[]).slice().sort().map(i => names[i]).join(' ') || 'Weekly';
  }
  return '';
}

function renderPanel(){
  const d = new Date(selectedDate + 'T00:00:00');
  const dow = d.getDay();
  document.getElementById('panelTitle').textContent = d.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'});
  const todayStr = fmt(new Date());
  const isToday = (selectedDate === todayStr);
  const todayBtn = document.getElementById('todayBtn');
  todayBtn.style.visibility = isToday ? 'hidden' : 'visible';
  const jumpInput = document.getElementById('jumpDate');
  if(jumpInput.value !== selectedDate) jumpInput.value = selectedDate;
  const clockEl = document.getElementById('liveClock');
  clockEl.textContent = isToday
    ? `It's ${new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})} — showing what's valid right now`
    : '';
  const body = document.getElementById('panelBody');
  let dayDeals = sortByTime(deals.filter(x => dealAppliesOnDate(x, selectedDate, dow)));
  if(isToday){
    dayDeals = dayDeals.filter(x => !(x.time && getTimeStatus(x) === 'ended'));
  }
  if(!dayDeals.length){
    body.innerHTML = '<p class="empty-state">No deals saved for this day yet.</p>';
    return;
  }
  body.innerHTML = dayDeals.map(x => dealCardHtml(x, isToday)).join('');
}

function renderStanding(){
  const body = document.getElementById('standingBody');
  const todayStr = fmt(new Date());
  const standing = sortByTime(deals.filter(x => x.repeat !== 'once' && (!x.endDate || x.endDate >= todayStr)));
  if(!standing.length){
    body.innerHTML = '<p class="empty-state">No recurring deals yet.</p>';
    return;
  }
  body.innerHTML = standing.map(x => dealCardHtml(x, true)).join('');
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderMap(){
  const todayStr = fmt(new Date());
  const pinned = deals.filter(x => typeof x.lat === 'number' && typeof x.lng === 'number' && (!x.endDate || x.endDate >= todayStr));
  const mapEl = document.getElementById('map');
  if(!pinned.length){
    mapEl.innerHTML = '<p class="empty-state" style="padding:12px;">No deals with map coordinates yet.</p>';
    return;
  }
  if(typeof L === 'undefined'){
    mapEl.innerHTML = '<p class="empty-state" style="padding:12px;">Map couldn\'t load (the map library didn\'t load — check your internet connection and reload).</p>';
    return;
  }
  try{
    if(!map){
      map = L.map('map');
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors',
        maxZoom: 19
      }).addTo(map);
      markerLayer = L.layerGroup().addTo(map);
    }
    markerLayer.clearLayers();
    const bounds = [];
    pinned.forEach(x => {
      const marker = L.marker([x.lat, x.lng]).addTo(markerLayer);
      const schedule = x.repeat === 'once' ? '' : `<div class="popup-schedule">${escapeHtml(scheduleLabel(x))}</div>`;
      marker.bindPopup(`<div class="popup-brand">${escapeHtml(x.brand || 'Untitled')}</div>${schedule}${x.discount ? `<div>${escapeHtml(x.discount)}</div>` : ''}${x.address ? `<div>${escapeHtml(x.address)}</div>` : ''}`);
      bounds.push([x.lat, x.lng]);
    });
    if(bounds.length === 1){
      map.setView(bounds[0], 14);
    } else {
      map.fitBounds(bounds, { padding: [24,24] });
    }
    setTimeout(() => map.invalidateSize(), 0);
  }catch(e){
    console.error('Map render failed', e);
    mapEl.innerHTML = '<p class="empty-state" style="padding:12px;">Map couldn\'t load right now.</p>';
  }
}

document.getElementById('prevDay').addEventListener('click', () => {
  const d = new Date(selectedDate + 'T00:00:00');
  d.setDate(d.getDate() - 1);
  selectedDate = fmt(d);
  render();
});
document.getElementById('nextDay').addEventListener('click', () => {
  const d = new Date(selectedDate + 'T00:00:00');
  d.setDate(d.getDate() + 1);
  selectedDate = fmt(d);
  render();
});
document.getElementById('todayBtn').addEventListener('click', () => {
  selectedDate = fmt(new Date());
  render();
});
document.getElementById('jumpDate').addEventListener('change', (e) => {
  if(e.target.value){
    selectedDate = e.target.value;
    render();
  }
});

document.getElementById('standingToggle').addEventListener('click', () => {
  const toggle = document.getElementById('standingToggle');
  const body = document.getElementById('standingBody');
  const expanded = toggle.getAttribute('aria-expanded') === 'true';
  toggle.setAttribute('aria-expanded', String(!expanded));
  body.classList.toggle('collapsed', expanded);
});

const DODGERS_TEAM_ID = 119;

async function checkDodgersDeal(){
  try{
    const y = new Date();
    y.setDate(y.getDate() - 1);
    const dateStr = fmt(y); // yesterday's date, since the deal is valid the day AFTER a home win
    const res = await fetch(`https://statsapi.mlb.com/api/v1/schedule?sportId=1&teamId=${DODGERS_TEAM_ID}&startDate=${dateStr}&endDate=${dateStr}`);
    if(!res.ok) throw new Error('bad response');
    const data = await res.json();
    let won = false;
    (data.dates || []).forEach(day => {
      (day.games || []).forEach(g => {
        const isFinal = g.status && g.status.abstractGameState === 'Final';
        const isHome = g.teams && g.teams.home && g.teams.home.team && g.teams.home.team.id === DODGERS_TEAM_ID;
        const homeWon = g.teams && g.teams.home && g.teams.home.isWinner === true;
        if(isFinal && isHome && homeWon) won = true;
      });
    });
    dodgersDealStatus = won ? 'active' : 'inactive';
  }catch(e){
    dodgersDealStatus = 'unknown';
  }
  render();
}

loadDeals();
checkDodgersDeal();
setInterval(render, 30000); // keep the live clock and "valid right now" badges fresh
</script>
